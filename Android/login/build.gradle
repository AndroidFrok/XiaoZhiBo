apply plugin: 'com.android.library'
apply from: '../common.gradle'
android {
    namespace "com.tencent.liteav.login"
    compileSdkVersion 28
    // buildToolsVersion "28.0.3"

    defaultConfig {

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    api project(':debug')
    api project(':basic')

    def projects = this.rootProject.getAllprojects().stream().map { project -> project.name }.collect()
    api projects.contains("tuicore") ? project(':tuicore') : "com.tencent.liteav.tuikit:tuicore:latest.release"
    api rootProject.getProperties().containsKey("liteavSdk") ? rootProject.ext.liteavSdk : "com.tencent.liteav:LiteAVSDK_Live:LiteAVSDK_Live:$rootProject.ext.liteavVersion"
}

